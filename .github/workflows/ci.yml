name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run (saves macOS minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Package needs Swift 6.2 (Xcode 26); pick the newest Xcode 26 on the runner.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh
